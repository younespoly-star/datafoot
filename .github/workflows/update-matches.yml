name: Mettre à jour les matchs

on:
  schedule:
    # Tous les jours à 06h00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permet aussi de le lancer à la main

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Récupérer les matchs et les cotes
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node scripts/fetch-matches.mjs

      - name: Publier les changements
        run: |
          git config user.name "datafoot-bot"
          git config user.email "actions@github.com"
          git add matches.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des matchs"
          git push
